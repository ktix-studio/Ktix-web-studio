<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KTIX — 3D Web Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/@studio-freight/lenis@1.0.27/dist/lenis.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d4b483;--bg:#0c0b0a}
body{background:var(--bg);color:#f5f1eb;font-family:Inter;overflow-x:hidden}
#webgl{position:fixed;inset:0;z-index:-1}
nav{position:fixed;top:0;width:100%;padding:20px 5%;display:flex;justify-content:space-between;mix-blend-mode:difference;z-index:10}
.logo{font-family:Instrument Serif;font-size:24px}
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 5%}
.hero h1{font-family:Instrument Serif;font-size:clamp(48px,10vw,140px);line-height:.85;letter-spacing:-3px}
.hero h1 em{color:var(--gold);font-style:italic}
.section{height:100vh;display:flex;align-items:center;padding:0 5%;border-top:1px solid rgba(255,255,255,.08)}
.card{max-width:500px;background:rgba(20,18,16,.8);backdrop-filter:blur(20px);border:1px solid rgba(212,180,131,.2);padding:32px;border-radius:20px}
.card h2{font-family:Instrument Serif;font-size:42px;margin-bottom:12px}
</style>
</head>
<body>
<canvas id="webgl"></canvas>
<nav><div class="logo">KTIX WEB STUDIO</div><div>SCROLL →</div></nav>
<div class="hero"><h1>Websites that<br><em>feel expensive</em></h1><p style="margin-top:20px;opacity:.6">Scroll to see 3D magic</p></div>
<div class="section"><div class="card"><h2>Vault</h2><p>19 luxury concepts ready to launch in 48h. 3D hover, gold grain.</p></div></div>
<div class="section"><div class="card"><h2>Climate Dashboard</h2><p>Live data viz with 3D depth.</p></div></div>
<div class="section"><div class="card"><h2>₹2,999 — Let's Build</h2><p>Your brand in 3D, not template.</p></div></div>

<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,100);
camera.position.z=3;
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#webgl'),alpha:true,antialias:true});
renderer.setSize(innerWidth,innerHeight);
const geo=new THREE.TorusGeometry(1,0.3,32,100);
const mat=new THREE.MeshStandardMaterial({color:0xd4b483,wireframe:true});
const torus=new THREE.Mesh(geo,mat);
scene.add(torus);
const light=new THREE.PointLight(0xd4b483,10);light.position.set(2,2,2);scene.add(light);
const ambient=new THREE.AmbientLight(0xffffff,0.2);scene.add(ambient);

let targetRot=0;
gsap.registerPlugin(ScrollTrigger);
gsap.to(torus.rotation,{y:Math.PI*2,scrollTrigger:{trigger:document.body,start:"top top",end:"bottom bottom",scrub:1}});

const lenis=new Lenis({lerp:0.08});
function raf(t){lenis.raf(t);requestAnimationFrame(raf)}raf();

function animate(){
 requestAnimationFrame(animate);
 torus.rotation.x+=0.002;
 torus.rotation.y+=0.002;
 renderer.render(scene,camera);
}
animate();
window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
</script>
</body>
</html>
