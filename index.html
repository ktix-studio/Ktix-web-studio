<style>
/* EMBERLINE PREMIUM STYLE */
:root {
  --bg: #0c0b0a; 
  --bg-gradient: radial-gradient(circle at 50% 0%, #1f1c18 0%, #0c0b0a 70%);
  --text-main: #f0ece2; 
  --text-muted: #8a857d; 
  --accent: #d4b483;
  --border: rgba(255, 255, 255, 0.08);
  --card-bg: rgba(255, 255, 255, 0.02);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);background-image:var(--bg-gradient);color:var(--text-main);line-height:1.6;overflow-x:hidden;min-height:100vh}
a{color:inherit;text-decoration:none;transition:0.3s}
.container{width:min(1120px,92%);margin:auto}

/* HEADER */
header{position:sticky;top:0;z-index:1000;background:rgba(12,11,10,0.85);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);padding:20px 0}
.nav{display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:var(--text-main);letter-spacing:1px;display:flex;gap:10px;align-items:baseline}
.logo strong{font-weight:600}
.logo small{font-size:12px;letter-spacing:3px;color:var(--accent);font-weight:600}
.logo span{color:var(--accent);font-style:italic}
nav{display:flex;align-items:center;gap:30px}
nav a{color:var(--text-muted);font-size:14px;font-weight:500;letter-spacing:0.5px}  
nav a:hover{color:var(--accent)}
.nav-btn{background:transparent;color:var(--text-main) !important;border:1px solid var(--border);padding:10px 24px;border-radius:50px;font-family:'Inter',sans-serif;font-size:14px}
.nav-btn:hover{background:var(--text-main);color:var(--bg) !important;border-color:var(--text-main)}
.menu-toggle{display:none;font-size:28px;color:var(--text-main);cursor:pointer}

/* HERO */
.hero{min-height:90vh;display:flex;align-items:center;position:relative;padding:100px 0}
.hero-content{max-width:850px}
.hero-logo{width:120px;margin-bottom:30px;border-radius:8px}
.eyebrow{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-bottom:30px}
h1{font-family:'Playfair Display',serif;font-size:clamp(50px,7vw,85px);line-height:1.05;margin-bottom:30px;font-weight:400}
h1 span{font-style:italic;color:var(--accent)}
.hero p{max-width:600px;color:var(--text-muted);font-size:18px;margin-bottom:40px;line-height:1.7}
.buttons{display:flex;gap:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:16px 32px;border-radius:50px;font-weight:500;border:1px solid var(--border);transition:0.3s;cursor:pointer;font-size:15px;font-family:'Inter',sans-serif}
.btn-primary{background:var(--text-main);color:var(--bg);border-color:var(--text-main)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
.btn-secondary{background:transparent;color:var(--text-main)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}

/* SECTIONS */
section{padding:120px 0}
.section-label{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-bottom:20px}
.section-title{font-family:'Playfair Display',serif;font-size:clamp(40px,5vw,60px);line-height:1.1;margin-bottom:25px;font-weight:400}
.section-text{color:var(--text-muted);max-width:600px;margin-bottom:60px;font-size:17px}

/* FIX: Map your class names */
.grid-3,.services-grid,.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:60px}
.process{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px}

.card,.service-card,.price-card,.why-card{background:var(--card-bg);border:1px solid var(--border);border-radius:4px;padding:40px 30px;transition:0.4s ease;position:relative}
.card:hover,.service-card:hover,.price-card:hover,.why-card:hover{border-color:var(--accent);background:rgba(255,255,255,0.04)}
.card-num,.service-number,.number{color:var(--accent);font-size:14px;font-weight:600;margin-bottom:25px;font-family:'Playfair Display',serif;font-style:italic}
.card h3,.service-card h3,.why-card strong,.step h3{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:15px;font-weight:400;color:var(--text-main);display:block}
.card p,.service-card p,.why-card p,.step p{color:var(--text-muted);font-size:15px;line-height:1.7;margin-top:10px}

/* PRICING */
.price-card.featured{border-color:var(--accent)}
.popular{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;letter-spacing:2px;color:var(--bg);background:var(--accent);padding:6px 16px;border-radius:20px;text-transform:uppercase}
.price{font-family:'Playfair Display',serif;font-size:42px;margin:25px 0;color:var(--text-main);font-weight:400}
.features{list-style:none;margin-bottom:35px;flex-grow:1}
.features li{color:var(--text-muted);margin:15px 0;font-size:15px;display:flex;align-items:center;gap:12px}
.features li::before{content:"•";color:var(--accent);font-size:20px}
.price-card .btn{width:100%}

/* CONTACT & OTHER SECTIONS */
.contact-section{background:rgba(0,0,0,0.2);border-top:1px solid var(--border)}
.contact-form label{display:block;color:var(--text-main);margin-bottom:10px;margin-top:20px;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase}
.contact-form input,.contact-form select,.contact-form textarea{width:100%;padding:16px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text-main);font-family:'Inter',sans-serif;font-size:16px;transition:0.3s}
.contact-form input:focus,.contact-form select:focus,.contact-form textarea:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,0.02)}
.climate-project{background:var(--card-bg);border:1px solid var(--border);padding:40px;border-radius:8px}
.climate-data-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0}

/* FOOTER */
footer{padding:60px 0;color:var(--text-muted);font-size:14px;border-top:1px solid var(--border)}
.footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
.footer-brand{font-family:'Playfair Display',serif;color:var(--text-main);font-size:24px}

@media(max-width:900px){ 
  .menu-toggle{display:block}
  nav{display:none;position:absolute;top:80px;left:0;width:100%;background:var(--bg);flex-direction:column;padding:30px;border-bottom:1px solid var(--border);gap:20px}
  nav.active{display:flex}
  .grid-3,.grid-2,.services-grid,.why-grid,.process,.pricing,.contact-grid,.climate-data-grid{grid-template-columns:1fr;gap:30px}
  .hero-content{padding:40px 0}
  .footer-inner{flex-direction:column;text-align:center}
}
</style>
